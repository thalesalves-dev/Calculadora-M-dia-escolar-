<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de média</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="cartao">
    <p class="etiqueta">Meu primeiro projeto com JavaScript</p>
    <h1>Calculadora de média</h1>
    <p>Informe o seu nome e duas notas de 0 a 10.</p>
    
    <!-- A) Campo do nome do estudante -->
    <label for="nome">Nome do estudante</label>
    <input id="nome" type="text" placeholder="Digite seu nome">

    <label for="nota1">Primeira nota</label>
    <input id="nota1" type="number" min="0" max="10" step="0.1">
    
    <label for="nota2">Segunda nota</label>
    <input id="nota2" type="number" min="0" max="10" step="0.1">
    
    <div class="acoes">
      <button id="calcular" type="button">Calcular média</button>
      <button id="limpar" type="button" class="secundario">Limpar</button>
    </div>
    
    <p id="resultado" role="status" aria-live="polite">Aguardando as notas.</p>
    
    <!-- D) Elemento novo para mostrar a contagem de cálculos válidos -->
    <p id="contador">Cálculos válidos: 0</p>
    
    <small>Regra didática: média a partir de 6. Não representa o regulamento da instituição.</small>
  </main>
</body>
</html>
